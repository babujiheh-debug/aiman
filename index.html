<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aiman AI Chat</title>
<style>
    :root {
        --bg: #120018;
        --panel: #1d0624;
        --panel-soft: #331133;
        --pink: #ff66cc;
        --pink-hot: #ff3fb7;
        --text: #ffffff;
        --muted: #d8b7d8;
        --bubble-user: #4c174e;
        --bubble-ai: #26102f;
        --border: rgba(255, 102, 204, 0.3);
    }

    * {
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: stretch;
        padding: 12px;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 20% 10%, rgba(255, 102, 204, 0.22), transparent 28%),
            radial-gradient(circle at 84% 18%, rgba(140, 35, 180, 0.25), transparent 34%),
            var(--bg);
    }

    .chat-shell {
        width: min(100%, 560px);
        min-height: calc(100vh - 24px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(18, 0, 24, 0.94);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
    }

    h1 {
        margin: 0;
        padding: 8px 0 4px;
        text-align: center;
        color: var(--pink);
        font-size: 26px;
        line-height: 1.2;
        text-shadow: 0 0 24px rgba(255, 102, 204, 0.55);
    }

    .chat-window {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.08);
        scroll-behavior: smooth;
    }

    .message {
        width: fit-content;
        max-width: min(82%, 420px);
        margin: 0 0 12px;
        padding: 11px 13px;
        border-radius: 18px;
        color: var(--text);
        font-size: 16px;
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    .message.ai {
        background: var(--bubble-ai);
        border: 1px solid rgba(255, 102, 204, 0.18);
        border-bottom-left-radius: 6px;
    }

    .message.user {
        margin-left: auto;
        background: var(--bubble-user);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-bottom-right-radius: 6px;
    }

    .composer {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    #input {
        width: 100%;
        min-height: 48px;
        padding: 13px 14px;
        border: 1px solid rgba(255, 102, 204, 0.24);
        border-radius: 14px;
        outline: none;
        color: #fff;
        background: var(--panel-soft);
        font-size: 16px;
    }

    #input::placeholder {
        color: rgba(255, 255, 255, 0.62);
    }

    .actions {
        display: flex;
        gap: 10px;
    }

    button {
        flex: 1;
        min-height: 46px;
        border: none;
        border-radius: 14px;
        color: #fff;
        background: linear-gradient(135deg, var(--pink-hot), #8f2dff);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.18s ease, filter 0.18s ease;
    }

    button:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
    }

    button:active {
        transform: translateY(0);
    }

    #micBtn.listening {
        background: linear-gradient(135deg, #ff4f83, #ff66cc);
        box-shadow: 0 0 22px rgba(255, 102, 204, 0.55);
    }

    .hint {
        margin: -3px 2px 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
    }

    @media (max-width: 520px) {
        body {
            padding: 0;
        }

        .chat-shell {
            min-height: 100vh;
            border-radius: 0;
            border-left: none;
            border-right: none;
        }
    }
</style>
</head>
<body>
<main class="chat-shell" aria-label="Aiman AI chat app">
    <h1>💖 AIMAN AI</h1>

    <section class="chat-window" id="chatBox" aria-live="polite" aria-label="Chat conversation"></section>

    <form class="composer" id="chatForm">
        <input id="input" type="text" placeholder="Talk to Aiman..." autocomplete="off" />
        <div class="actions">
            <button id="sendBtn" type="submit">Send 💬</button>
            <button id="micBtn" type="button" aria-label="Start voice input">🎤</button>
        </div>
        <p class="hint" id="voiceHint">Type a message or use the microphone if your browser supports speech recognition.</p>
    </form>
</main>

<script>
const chatBox = document.getElementById("chatBox");
const chatForm = document.getElementById("chatForm");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
const voiceHint = document.getElementById("voiceHint");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

const replies = [
    "I'm here with you. Tell me more, and I'll help you think it through.",
    "That sounds important. Let's take it one step at a time.",
    "I hear you. What would feel like the best next move right now?",
    "You've got this. I can help you organize the idea into a simple plan.",
    "Thank you for sharing that with Aiman AI."
];

function appendMessage(text, sender) {
    const message = document.createElement("p");
    message.className = `message ${sender}`;
    message.textContent = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function createReply(text) {
    const lower = text.toLowerCase();

    if (lower.includes("hello") || lower.includes("hi")) {
        return "Hi 💖 I'm Aiman AI. How can I help you today?";
    }

    if (lower.includes("sad") || lower.includes("upset")) {
        return "I'm sorry you're feeling that way. Take a deep breath with me, then tell me what happened.";
    }

    if (lower.includes("plan") || lower.includes("todo") || lower.includes("task")) {
        return "Let's make a gentle plan: choose one priority, set a small first step, then celebrate progress.";
    }

    return replies[Math.floor(Math.random() * replies.length)];
}

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    input.value = "";

    window.setTimeout(() => {
        appendMessage(createReply(text), "ai");
    }, 350);
}

chatForm.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage();
});

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.addEventListener("start", () => {
        micBtn.classList.add("listening");
        micBtn.setAttribute("aria-label", "Listening for voice input");
        voiceHint.textContent = "Listening... speak now.";
    });

    recognition.addEventListener("result", (event) => {
        input.value = event.results[0][0].transcript;
        sendMessage();
    });

    recognition.addEventListener("end", () => {
        micBtn.classList.remove("listening");
        micBtn.setAttribute("aria-label", "Start voice input");
        voiceHint.textContent = "Type a message or use the microphone if your browser supports speech recognition.";
    });

    micBtn.addEventListener("click", () => recognition.start());
} else {
    micBtn.disabled = true;
    micBtn.title = "Speech recognition is not supported in this browser.";
    voiceHint.textContent = "Voice input is not supported in this browser, but typing still works.";
}

appendMessage("Hi 💖 I'm Aiman AI. Talk to me anytime.", "ai");
</script>
</body>
</html>
